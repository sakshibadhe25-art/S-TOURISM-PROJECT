<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2 class="logo">S TOURISM</h2>
    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="packages.html">Packages</a>
        <a href="contact.html">Contact</a>
        <a href="my-bookings.html">My Bookings</a>
    </nav>
</header>

<section class="info">
    <h2>Create an Account</h2>
    <form class="card" onsubmit="registerUser(event)">
        <input type="text" id="name" placeholder="Full Name" required><br><br>
        <input type="email" id="email" placeholder="Email Address" required><br><br>
        <input type="password" id="password" placeholder="Password" required><br><br>
        <button class="btn">Register</button>
        <p>Already have an account? </p><a href="login.html" class="smallbtn">Login here</a>
    </form>
</section>

<script>
async function registerUser(e) {
    e.preventDefault(); // Prevents the page from refreshing

    // 1. Get the values the user typed
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let userData = {
        name: name,
        email: email,
        password: password
    };

    try {
        // 2. Send the data to your Java Backend
        const response = await fetch('http://localhost:8080/api/auth/register', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify(userData)
        });

        // 3. Check if it worked
        if (response.ok) {
            alert("Registration Successful! Please Login.");
            window.location.href = "login.html";
        } else {
            let errorMsg = await response.text();
            alert("Registration Failed: " + errorMsg);
        }
    } catch (error) {
        console.error("Error:", error);
        alert("Server error. Is the Java backend running?");
    }
}
</script>

<footer>
    <p>Tourism Booking System</p>
</footer>

</body>
</html>
