<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - S Tourism</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><h2 class="logo">S TOURISM</h2></header>

    <section class="info">
        <h2>Reset Password</h2>
        <div class="login-container">
            <form id="forgotForm" class="card">
                <p style="font-size: 0.9rem; margin-bottom: 15px;">Enter your email to reset your password.</p>
                <input type="email" id="resetEmail" placeholder="Your Registered Email" required>
                <button type="submit" class="btn">Send Reset Link</button>
                <br>
                <a href="login.html" style="font-size: 0.8rem;">Back to Login</a>
            </form>
            <p id="reset-msg" style="margin-top:10px;"></p>
        </div>
    </section>

    <script>
        document.getElementById("forgotForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("resetEmail").value;
            const msg = document.getElementById("reset-msg");

            try {
                const response = await fetch(`http://localhost:8080/api/auth/forgot-password?email=${email}`, {
                    method: 'POST'
                });
                if (response.ok) {
                    msg.style.color = "green";
                    msg.innerText = "Reset instructions sent to your email!";
                } else {
                    msg.style.color = "red";
                    msg.innerText = "Email not found.";
                }
            } catch (err) {
                msg.innerText = "Server error.";
            }
        });
    </script>
</body>
</html>
